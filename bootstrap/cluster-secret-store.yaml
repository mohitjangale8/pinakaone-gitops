# Tells External Secrets Operator where to pull secrets from: AWS Secrets
# Manager in this account/region. No explicit credentials configured on
# purpose - ESO falls back to the AWS SDK's default credential chain,
# which on this (non-EKS) cluster resolves to the EC2 instance's own IAM
# role via the instance metadata service. Cluster-wide (not per-namespace),
# so every project's ExternalSecrets can reference this same store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
