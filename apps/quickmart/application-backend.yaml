apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickmart-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohitjangale8/pinakaone-gitops.git
    targetRevision: main
    path: charts/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: quickmart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Without this, selfHeal treats the HPA's own replica-count changes as
  # drift from the Helm-rendered replicas: 1 and reverts them on every
  # sync - fighting the HPA (templates/hpa.yaml) into permanent
  # ineffectiveness rather than letting it actually scale anything.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: quickmart-backend
      jsonPointers:
        - /spec/replicas
