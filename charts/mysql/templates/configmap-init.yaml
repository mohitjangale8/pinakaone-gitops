# The official mysql image only auto-creates root (via MYSQL_ROOT_PASSWORD)
# and one app user (via MYSQL_USER/MYSQL_PASSWORD, scoped to MYSQL_DATABASE)
# from plain env vars. This script runs on first boot (mounted into
# /docker-entrypoint-initdb.d/, sourced - not executed - by the image's own
# entrypoint, so it inherits the container's env vars directly) to create
# the other two accounts in our 4-tier model: pinakaone_admin (full access,
# any host - for Workbench over the SSM tunnel) and quickmart_local (scoped
# to just the app database - for running the backend locally against the
# real cloud DB).
#
# IMPORTANT: this MySQL image version creates root@'%' by default (in
# addition to root@localhost) even without MYSQL_ROOT_HOST set - contrary
# to older documented behavior. root@'%' is explicitly dropped below so
# root is only ever reachable via kubectl exec, never over the network,
# matching the intended design (see pinakaone-iac/modules/secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: {{ .Release.Namespace }}
data:
  init-extra-users.sh: |
    #!/bin/bash
    # This file is SOURCED (not executed as a subprocess) by the mysql
    # image's own entrypoint script - `set` options here would otherwise
    # leak into and break the rest of that script. Confining them to a
    # subshell keeps the blast radius to just this file.
    (
    set -euo pipefail
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<EOSQL
    CREATE USER IF NOT EXISTS '${MYSQL_ADMIN_USER}'@'%' IDENTIFIED BY '${MYSQL_ADMIN_PASSWORD}';
    GRANT ALL PRIVILEGES ON *.* TO '${MYSQL_ADMIN_USER}'@'%' WITH GRANT OPTION;
    CREATE USER IF NOT EXISTS '${MYSQL_LOCAL_USER}'@'%' IDENTIFIED BY '${MYSQL_LOCAL_PASSWORD}';
    GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_LOCAL_USER}'@'%';
    DROP USER IF EXISTS 'root'@'%';
    FLUSH PRIVILEGES;
    EOSQL
    )
