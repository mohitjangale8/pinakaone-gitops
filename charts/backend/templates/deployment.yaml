apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.project }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  # Recreate, not the default RollingUpdate: the pod binds hostPort
  # {{ .Values.containerPort }} on this single-node cluster, so a new pod
  # can never be scheduled alongside the still-running old one (the
  # scheduler rejects it outright - "didn't have free ports") - every
  # rolling update would hang in Pending forever without this.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.project }}-backend
  template:
    metadata:
      labels:
        app: {{ .Values.project }}-backend
    spec:
      imagePullSecrets:
        - name: {{ .Values.ecr.imagePullSecretName }}
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ .Values.mysql.host }} {{ .Values.mysql.port }}; do
                echo "waiting for {{ .Values.mysql.host }}:{{ .Values.mysql.port }}..."
                sleep 2
              done
              echo "mysql is reachable"
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            # hostPort exposes this directly on the node's own network
            # interface - stage 1 of public access (plain HTTP, no domain/TLS
            # yet), reachable at http://<elastic-ip>:{{ .Values.containerPort }}.
            # Fine for a single-node cluster; would need an Ingress instead on
            # a real multi-node setup.
            - containerPort: {{ .Values.containerPort }}
              hostPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Values.project }}-backend-config
            - secretRef:
                name: {{ .Values.project }}-backend-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
