# ECR login tokens expire every 12h - this keeps quickmart-ecr-pull valid
# forever without any static credential ever existing anywhere. Gets the
# token via the node's instance role (already has ecr:GetAuthorizationToken
# - see pinakaone-iac's ec2-spot module) rather than anything stored in the
# cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.project }}-ecr-refresh
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.ecr.refreshSchedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ .Values.project }}-ecr-refresh
          restartPolicy: OnFailure
          initContainers:
            - name: get-token
              image: amazon/aws-cli:2.15.0
              command:
                - sh
                - -c
                - aws ecr get-login-password --region {{ .Values.ecr.region }} > /token/password
              volumeMounts:
                - name: token
                  mountPath: /token
          containers:
            - name: apply-secret
              image: bitnami/kubectl:1.30
              command:
                - sh
                - -c
                - |
                  kubectl create secret docker-registry {{ .Values.ecr.imagePullSecretName }} \
                    --docker-server={{ .Values.ecr.registry }} \
                    --docker-username=AWS \
                    --docker-password="$(cat /token/password)" \
                    --namespace={{ .Release.Namespace }} \
                    --dry-run=client -o yaml | kubectl apply -f -
              volumeMounts:
                - name: token
                  mountPath: /token
          volumes:
            - name: token
              emptyDir: {}
